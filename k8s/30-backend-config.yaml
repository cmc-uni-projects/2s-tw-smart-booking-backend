# Non-secret settings of the backend, injected as environment variables (envFrom in 31-backend.yaml).
# Spring Boot reads them through application.yml placeholders like ${DB_HOST}.
# Lesson 0005. Secrets (passwords, JWT key) are in the Secret "sb-secrets" instead, see README.md.
#
# After editing: kubectl apply -f 30-backend-config.yaml && kubectl -n sb rollout restart deploy/backend
# (pods read env vars only at start).
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: sb
data:
  SERVER_PORT: "8080"
  SPRING_PROFILES_ACTIVE: local          # local = emails to Mailpit; dev = real SMTP
  LIQUIBASE_CONTEXTS: demo               # demo = demo accounts, hotels, bookings
  FORWARD_HEADERS_STRATEGY: framework    # behind the ingress: trust X-Forwarded-* headers
  DB_HOST: mysql                         # the Service name from 20-mysql.yaml
  DB_PORT: "3306"
  DB_NAME: smart_booking
  DB_USER_NAME: smart_booking
  FRONTEND_URL: http://sb.localhost:8080 # used for CORS and links in emails
  LOCAL_MAIL_HOST: mailpit               # the Service name from 10-mailpit.yaml
  LOCAL_MAIL_PORT: "1025"
  MAIL_USERNAME: no-reply@smart-booking.local   # the From address
  R2_ENDPOINT: http://storage.invalid:9000      # no object storage locally: uploads fail, demo images are external URLs
  R2_BUCKET_NAME: smart-booking
  GOOGLE_CLIENT_ID: local-dummy             # Spring refuses to start with an empty client id; Google/Facebook login is off locally
  FACEBOOK_CLIENT_ID: local-dummy
  LOG_PATH: /app/logs
  LOG_LEVEL_APP: INFO
  LOG_LEVEL_SERVICE: INFO
