email.applicationSubmittedConfirmation.p2=Đơn của bạn hiện đang ở trạng thái <strong>Chờ xử lý (PENDING)</strong>. Chúng tôi sẽ xem xét hồ sơ và phản hồi qua email trong thời gian sớm nhất.
