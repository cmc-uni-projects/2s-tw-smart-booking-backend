# accountLocked
email.accountLocked.a1=Liên hệ Hỗ trợ
email.accountLocked.p1=Chúng tôi rất tiếc phải thông báo rằng tài khoản <strong>TravelMate</strong> của bạn đã bị <strong>KHÓA</strong> (hoặc tạm ngưng) do vi phạm chính sách của hệ thống.
email.accountLocked.p2=Nếu bạn cho rằng đây là sự nhầm lẫn hoặc muốn khiếu nại, vui lòng liên hệ với bộ phận hỗ trợ của chúng tôi bằng cách nhấn vào nút bên dưới:
