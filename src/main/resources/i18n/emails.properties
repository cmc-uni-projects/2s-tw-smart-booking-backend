email.bookingConfirmation.p2=Bạn có thể xem chi tiết đơn đặt phòng, hướng dẫn check-in và quản lý chuyến đi bằng cách nhấn vào nút bên dưới:
email.bookingConfirmation.p3=Nếu bạn không thực hiện yêu cầu này hoặc có thắc mắc, vui lòng liên hệ với bộ phận hỗ trợ ngay lập tức.
