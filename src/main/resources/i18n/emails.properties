# cancellationRequest
email.cancellationRequest.h21=Hủy phòng thành công
email.cancellationRequest.p2=Đơn đặt phòng của bạn đã được hủy theo yêu cầu. Dưới đây là thông tin chi tiết:
email.cancellationRequest.p3=<strong>Lưu ý:</strong> Yêu cầu hoàn tiền của bạn đã được tự động chuyển đến bộ phận kế toán. Admin sẽ kiểm tra và thực hiện hoàn tiền trong vòng <strong>3-5 ngày làm việc</strong>.
