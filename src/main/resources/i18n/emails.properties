# cancellationSuccess
email.cancellationSuccess.h21=Hoàn tiền thành công
email.cancellationSuccess.p2=TravelMate xin thông báo: Yêu cầu hoàn tiền cho đơn đặt phòng của bạn đã được <strong>CHẤP NHẬN</strong> và thực hiện thành công.
email.cancellationSuccess.p3=<strong>Lưu ý quan trọng:</strong><br> Hệ thống đã thực hiện lệnh chuyển tiền. Tùy thuộc vào ngân hàng thụ hưởng, số tiền có thể nổi trong tài khoản của bạn <strong>ngay lập tức</strong> hoặc mất từ <strong>1-3 ngày làm việc</strong>.
email.cancellationSuccess.p4=Vui lòng kiểm tra sao kê ngân hàng của bạn. Nếu sau thời gian trên bạn chưa nhận được tiền, hãy liên hệ ngay với chúng tôi.
