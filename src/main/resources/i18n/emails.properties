email.bookingConfirmation.strong4=Ngày trả phòng:
email.bookingConfirmation.title1=Xác nhận đặt phòng - TravelMate

# bookingPending
email.bookingPending.em1=Lưu ý: Đơn đặt phòng sẽ tự động hủy nếu không được thanh toán trong thời gian quy định.
email.bookingPending.p1=Cảm ơn bạn đã đặt phòng tại <strong>TravelMate</strong>. Đơn đặt phòng <strong>#<span>{0}</span></strong> của bạn đang ở trạng thái <strong>Chờ thanh toán</strong>.
