email.propertySuspended.p2=Chúng tôi rất tiếc phải thông báo rằng cơ sở lưu trú của bạn đã bị <strong>tạm dừng hoạt động</strong> trên hệ thống TravelMate do vi phạm chính sách hoặc yêu cầu từ quản trị viên.
email.propertySuspended.p4=<span class="label">Lý do:</span> <span style="color: #d32f2f; font-weight: bold;">{0}</span>
email.propertySuspended.p5=Trong thời gian này, cơ sở của bạn sẽ không hiển thị trên kết quả tìm kiếm và không thể nhận đặt phòng mới. Các đặt phòng hiện tại (nếu có) có thể cần được xử lý thủ công.
email.propertySuspended.p6=Nếu bạn cho rằng đây là sự nhầm lẫn hoặc muốn giải quyết vấn đề để mở lại hoạt động, vui lòng liên hệ với bộ phận hỗ trợ của chúng tôi hoặc trả lời email này.
email.propertySuspended.p8=Đây là email tự động, vui lòng không trả lời trực tiếp email này nếu không cần thiết.
