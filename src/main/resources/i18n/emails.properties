# applicationSubmittedConfirmation
email.applicationSubmittedConfirmation.div1=<strong style="color: #006494;">Chi tiết đơn:</strong><br> <strong>Số đơn:</strong> <span>{0}</span><br> <strong>Ngày nộp:</strong> <span>{1}</span>
