# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.port=${SERVER_PORT:8080}
spring.application.name=smart-booking-system

# ==========================================
# DATABASE CONFIGURATION (TiDB Cloud)
# ==========================================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USER_NAME}
spring.datasource.password=${DB_USER_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ==========================================
# SECURITY & JWT
# ==========================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# URL Frontend (Local localhost:5173,
app.frontend.url=${FRONTEND_URL}
# CORS Configuration
app.cors.allowedOrigins=${FRONTEND_URL}

# ==========================================
# OAUTH2 (GOOGLE & FACEBOOK)
# ==========================================
# Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Facebook
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
spring.security.oauth2.client.registration.facebook.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v19.0/dialog/oauth
spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/v19.0/oauth/access_token
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/me?fields=id,name,email,picture

# Redirect
app.oauth2.redirectUri=${FRONTEND_URL}/oauth2/redirect

# ==========================================
# EMAIL CONFIGURATION (GMAIL SMTP)
# ==========================================
spring.mail.protocol=smtp
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ==========================================
# THIRD PARTY SERVICES (AI, CLOUD STORAGE)
# ==========================================
# Gemini AI
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent

# Cloudflare R2 (Storage)
r2.accessKeyId=${R2_ACCESS_KEY}
r2.secretKey=${R2_SECRET_KEY}
r2.endpoint=${R2_ENDPOINT}
r2.bucket=${R2_BUCKET_NAME}

# ==========================================
# FILE UPLOAD & MISC
# ==========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Logging
logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

file.upload-dir=${FILE_UPLOAD_DIR:./uploads}
file.static-path-pattern=${FILE_STATIC_PATH_PATTERN:/images/**}
file.static-url-prefix=${FILE_STATIC_URL_PREFIX:/images}