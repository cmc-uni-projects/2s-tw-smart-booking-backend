# Application Info
spring.application.name=smart-booking-system
server.port=8386

# Database Configuration - MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/smart_booking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=Qthanh0704@@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# Flyway Migration
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=smart_booking_db
spring.flyway.user=root
spring.flyway.password=1234

# JWT Configuration
app.jwt.secret=YourVeryLongSecretKeyThatShouldBeAtLeast512BitsForHS512AlgorithmSecurity
app.jwt.expiration=86400000

# Frontend URL
app.frontend.url=http://localhost:5173

# Email Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=travelmate.co.ltd@gmail.com
spring.mail.password=ypzrwkvxtjtdsefk
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# AWS S3 Configuration (Optional)
aws.s3.bucket-name=smart-booking-uploads
aws.s3.region=ap-southeast-1
aws.s3.access-key=your-access-key
aws.s3.secret-key=your-secret-key

# Redis Configuration (Optional for caching)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.cache.type=none
spring.cache.redis.time-to-live=600000

# Logging
logging.level.root=INFO
logging.level.com.smartbooking=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.flywaydb=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Jackson JSON
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Thymeleaf for email templates
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# B?T BU?C: Ra l?nh cho Hibernate s? d?ng chính xác tên c?t trong Entity
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl