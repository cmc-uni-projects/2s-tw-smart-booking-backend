<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Thanh toán bị từ chối</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f9fb; margin: 0; padding: 0; color: #333; }
        .container { max-width: 600px; margin: 40px auto; background-color: #ffffff; border-radius: 12px; overflow: hidden; border: 1px solid #e3eef3; }
        .header { background: #dc3545; color: #ffffff; text-align: center; padding: 30px 20px; }
        .content { padding: 35px 30px; line-height: 1.7; }
        .reason-box { background: #fcf1f1; padding: 20px; border-radius: 8px; border: 1px solid #f5c6cb; color: #dc3545; }
        .footer { background-color: #f7f9fa; text-align: center; padding: 20px; font-size: 12px; color: #888; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>⚠️ Thanh Toán Bị Từ Chối</h2>
    </div>
    <div class="content">
        <h3>Xin chào <strong th:text="${customerName}">Khách hàng</strong>,</h3>
        <p>Rất tiếc, giao dịch thanh toán cho đơn đặt phòng <strong>#<span th:text="${bookingId}"></span></strong> đã bị Admin <strong>TỪ CHỐI</strong>.</p>

        <div class="reason-box">
            <strong>Lý do:</strong> <span th:text="${reason}">Thông tin không hợp lệ</span>
        </div>

        <p>Đơn đặt phòng của bạn đã bị hủy. Nếu đây là sự nhầm lẫn, vui lòng liên hệ bộ phận hỗ trợ hoặc thực hiện đặt phòng lại.</p>
    </div>
    <div class="footer">
        <p>&copy; 2025 TravelMate.</p>
    </div>
</div>
</body>
</html>
