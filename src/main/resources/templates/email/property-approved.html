<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Cơ sở được duyệt - TravelMate</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f9fb; margin: 0; padding: 0; color: #333; }
        .container { max-width: 600px; margin: 40px auto; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08); border: 1px solid #e3eef3; }
        /* HEADER CHUẨN MỚI */
        .header { background-color: #ffffff; border-bottom: 3px solid #00a8e8; text-align: center; padding: 0; line-height: 0; font-size: 0; }
        .header img { width: 280px; max-width: 100%; height: auto; display: block; margin: 0 auto; border: 0; }
        /* CONTENT */
        .content { padding: 35px 30px; line-height: 1.7; font-size: 15px; }
        .content h2 { color: #28a745; /* Xanh lá */ margin-bottom: 10px; margin-top: 0; font-size: 24px; }
        .content p { margin-bottom: 20px; font-size: 15px; color: #444; }
        .reason-box { font-size: 14px; background: #f1faf1; padding: 20px; border-radius: 8px; border: 1px solid #c8e6c9; line-height: 1.8; }
        .footer { background-color: #f7f9fa; text-align: center; padding: 20px; font-size: 12px; color: #888; border-top: 1px solid #e0e8ec; line-height: 1.5; }
        @media (max-width: 600px) { .content { padding: 25px 20px; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <a href="#"><img src="https://i.ibb.co/Kx15sHvZ/logo-travelmate-xoafont.png" alt="logo-travelmate" border="0"></a>
    </div>
    <div class="content">
        <h2>✅ Chúc mừng <strong th:text="${ownerName}">Chủ cơ sở</strong>!</h2>
        <p>Cơ sở lưu trú của bạn, <strong><span th:text="${propertyName}">[Tên cơ sở]</span></strong>, đã được <strong>DUYỆT</strong> và hiện đã chính thức hiển thị trên hệ thống <strong>TravelMate</strong>.</p>
        <div class="reason-box">
            <strong style="color: #28a745;">Ghi chú từ Admin:</strong>
            <p style="margin: 5px 0 0 0; color: #555;" th:text="${reason}">Thông tin cơ sở đầy đủ và hợp lệ.</p>
        </div>
    </div>
    <div class="footer"><p>&copy; 2025 TravelMate. Mọi quyền được bảo lưu.</p></div>
</div>
</body>
</html>
