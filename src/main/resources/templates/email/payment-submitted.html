<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Đã nhận thông tin thanh toán</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f9fb; margin: 0; padding: 0; color: #333; }
        .container { max-width: 600px; margin: 40px auto; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 6px 16px rgba(0,0,0,0.08); border: 1px solid #e3eef3; }
        .header { background: linear-gradient(135deg, #00a8e8, #006494); color: #ffffff; text-align: center; padding: 30px 20px; }
        .content { padding: 35px 30px; line-height: 1.7; }
        .info-box { background: #f1faff; padding: 20px; border-radius: 8px; border: 1px solid #d1ecf1; margin-top: 20px; }
        .footer { background-color: #f7f9fa; text-align: center; padding: 20px; font-size: 12px; color: #888; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>TravelMate - Thanh Toán</h2>
    </div>
    <div class="content">
        <h3>Xin chào <strong th:text="${customerName}">Khách hàng</strong>,</h3>
        <p>Chúng tôi đã nhận được bằng chứng thanh toán cho đơn đặt phòng của bạn. Admin sẽ kiểm tra và xác nhận trong thời gian sớm nhất.</p>

        <div class="info-box">
            <strong>Mã đặt phòng:</strong> <span th:text="${bookingId}">#123</span><br>
            <strong>Số tiền:</strong> <span th:text="${amount}">0 VND</span><br>
            <strong>Thời gian gửi:</strong> <span th:text="${submittedDate}">...</span>
        </div>

        <p>Vui lòng chờ email xác nhận tiếp theo.</p>
    </div>
    <div class="footer">
        <p>&copy; 2025 TravelMate.</p>
    </div>
</div>
</body>
</html>
