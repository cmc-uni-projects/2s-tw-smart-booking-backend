apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sb.fullname" . }}-backend
  labels:
    {{- include "sb.labels" . | nindent 4 }}
    {{- include "sb.selector" (list . "backend") | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  strategy:
    type: {{ .Values.backend.strategy }}
  selector:
    matchLabels: {{- include "sb.selector" (list . "backend") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "sb.selector" (list . "backend") | nindent 8 }}
      annotations:
        # roll the pod when configuration or secrets change
        checksum/config: {{ include (print $.Template.BasePath "/backend-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- include "sb.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.mysql.enabled }}
      initContainers:
        # Liquibase needs the database up before the app starts
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z {{ include "sb.dbHost" . }} 3306; do echo waiting for mysql; sleep 3; done"]
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          envFrom:
            - configMapRef:
                name: {{ include "sb.fullname" . }}-backend
          env:
            {{- range list "DB_USER_PASSWORD" "JWT_SECRET" "MAIL_PASSWORD" "GEMINI_API_KEY" "R2_ACCESS_KEY" "R2_SECRET_KEY" "GOOGLE_CLIENT_SECRET" "FACEBOOK_CLIENT_SECRET" }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "sb.secretName" $ }}
                  key: {{ . }}
            {{- end }}
            {{- with .Values.backend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:          # Liquibase + Spring boot can take a while on first start
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: logs
          {{- if .Values.backend.logging.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "sb.fullname" . }}-backend-logs
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sb.fullname" . }}-backend
  labels: {{- include "sb.labels" . | nindent 4 }}
spec:
  selector: {{- include "sb.selector" (list . "backend") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- if .Values.backend.logging.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "sb.fullname" . }}-backend-logs
  labels: {{- include "sb.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.backend.logging.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backend.logging.persistence.size }}
{{- end }}
