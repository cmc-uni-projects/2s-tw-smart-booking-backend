{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sb.fullname" . }}
  labels: {{- include "sb.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER_PASSWORD: {{ required "secrets.dbPassword is required" .Values.secrets.dbPassword | quote }}
  {{- if .Values.mysql.enabled }}
  MYSQL_ROOT_PASSWORD: {{ required "secrets.mysqlRootPassword is required when mysql.enabled" .Values.secrets.mysqlRootPassword | quote }}
  {{- end }}
  JWT_SECRET: {{ required "secrets.jwtSecret is required (openssl rand -hex 64)" .Values.secrets.jwtSecret | quote }}
  MAIL_PASSWORD: {{ .Values.secrets.mailPassword | quote }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
  R2_ACCESS_KEY: {{ .Values.secrets.r2AccessKey | quote }}
  R2_SECRET_KEY: {{ .Values.secrets.r2SecretKey | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.googleClientSecret | quote }}
  FACEBOOK_CLIENT_SECRET: {{ .Values.secrets.facebookClientSecret | quote }}
{{- end }}
